<!-- /homestay.html -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/images/jump/favicon.png">
  <title>에코숙박</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />
  <link rel="stylesheet" href="/assets/css/footer.css" />
  <link rel="stylesheet" href="/assets/css/pages/homestay.css" />

  <script src="/assets/js/partials.js"></script>
  <script type="module" src="/assets/js/firebase-init.js"></script>
  <script type="module" src="/assets/js/firestore-bridge.js"></script>
</head>
<body>
  <div id="siteHeader"></div>

  <main class="page">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-top">
          <h1 class="hero-title">에코 숙박</h1>
          <p class="hero-desc">에코 숙박을 통해 탄소중립실천을 실현해보세요</p>
        </div>

        <div class="hero-actions">
          <a class="btn btn--ghost" href="/index.html">우리마을 소개</a>
          <a class="btn btn--primary" href="/family-register.html">회원등록</a>
          <a class="btn" href="/homestay_new.html" data-role="guide admin" id="btnHomestayNew">홈스테이 신규생성</a>
        </div>
      </div>
    </section>

    <!-- 객실 사진관(썸네일 여러 장 + 넘김) -->
    <section class="section" id="homestay-rooms">
      <div class="section-h">
        <h2 class="section-title">객실 사진관</h2>
      </div>

      <div class="panel room-panel">
        <div class="room-view">
          <button class="room-nav room-nav--prev" type="button" id="roomPrev" aria-label="이전 사진">‹</button>

          <div class="room-stage">
            <img id="roomSlideImg" loading="lazy" class="room-img" alt="객실 사진" />
            <div class="room-meta">
              <span id="roomSlideIndex" class="room-index">-</span>
            </div>
          </div>

          <button class="room-nav room-nav--next" type="button" id="roomNext" aria-label="다음 사진">›</button>
        </div>

        <!-- 썸네일 스트립 -->
        <div class="room-thumbs-wrap" aria-label="객실 썸네일">
          <button class="thumb-nav" type="button" id="thumbPrev" aria-label="이전 썸네일">‹</button>

          <div class="room-thumbs" id="roomThumbs" tabindex="0" aria-label="객실 썸네일 목록"></div>

          <button class="thumb-nav" type="button" id="thumbNext" aria-label="다음 썸네일">›</button>
        </div>

        <div class="help small" id="roomSlideHelp" style="margin-top:10px;"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-h">
        <h2 class="section-title">공개 홈스테이</h2>
        <div class="section-tools">
          <input id="qSearch" class="input" placeholder="집이름/오션파크1·2·3/회원 검색" />

          <!-- 카테고리 필터 -->
          <div class="category-filters">
            <select id="qCountry" class="select select--small">
              <option value="">국가 전체</option>
              <option value="korea">🇰🇷 한국</option>
              <option value="vietnam">🇻🇳 베트남</option>
              <option value="other">🌍 기타</option>
            </select>

            <select id="qRegion" class="select select--small">
              <option value="">지역 전체</option>
              <option value="oceanpark1">오션파크1</option>
              <option value="oceanpark2">오션파크2</option>
              <option value="oceanpark3">오션파크3</option>
              <option value="other">기타 지역</option>
            </select>

            <select id="qType" class="select select--small">
              <option value="">숙박종류 전체</option>
              <option value="homestay">🏠 홈스테이</option>
              <option value="hotel">🏨 호텔</option>
              <option value="motel">🏩 모텔</option>
              <option value="guesthouse">🏘 게스트하우스</option>
              <option value="resort">🏖 리조트</option>
              <option value="villa">🏡 빌라</option>
              <option value="other">🏘 기타</option>
            </select>
          </div>

          <select id="qSort" class="select">
            <option value="recent">최신</option>
            <option value="rating">평점 높은 순</option>
            <option value="reviews">리뷰 많은 순</option>
          </select>
        </div>
      </div>
      <div id="itemsState" class="state">로딩중...</div>
      <div id="itemsGrid" class="grid"></div>
      <div class="help small">홈스테이는 category=hotel(또는 homestay)로 등록된 놀거리만 표시됩니다.</div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script type="module" src="/assets/js/header-auth.js"></script>
  <script type="module" src="/assets/js/pages/homestay.rooms.js"></script>
  <script type="module" src="/assets/js/pages/homestay.js"></script>
</body>
</html>

<!-- /homestay.html -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/images/jump/favicon.png">
  <title>에코숙박</title>

  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />
  <link rel="stylesheet" href="/assets/css/footer.css" />
  <link rel="stylesheet" href="/assets/css/pages/homestay.css" />

  <script src="/assets/js/partials.js"></script>
  <script type="module" src="/assets/js/firebase-init.js"></script>
  <script type="module" src="/assets/js/firestore-bridge.js"></script>
</head>
<body>
  <div id="siteHeader"></div>

  <main class="page">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-top">
          <h1 class="hero-title">에코 숙박</h1>
          <p class="hero-desc">에코 숙박을 통해 탄소중립실천을 실현해보세요</p>
        </div>

        <div class="hero-actions">
          <a class="btn btn--primary" href="/family-register.html">숙박가맹점등록</a>
          <a class="btn" href="/homestay_new.html" data-role="guide admin" id="btnHomestayNew">객실생성</a>
        </div>
      </div>
    </section>


    <section class="section">
      <div class="section-h">
        <h2 class="section-title">예약가능 숙박상품</h2>
        <div class="section-tools">
          <input id="qSearch" class="input" placeholder="집이름/그린1·2·3/회원 검색" />

          <!-- 카테고리 필터 -->
          <div class="category-filters">
            <select id="qCountry" class="select select--small">
              <option value="">국가 전체</option>
              <option value="korea">🇰🇷 한국</option>
              <option value="vietnam">🇻🇳 베트남</option>
              <option value="other">🌍 기타</option>
            </select>

            <select id="qRegion" class="select select--small">
              <option value="">지역 전체</option>
              <option value="oceanpark1">그린1</option>
              <option value="oceanpark2">그린2</option>
              <option value="oceanpark3">그린3</option>
              <option value="other">기타 지역</option>
            </select>

            <select id="qType" class="select select--small">
              <option value="">숙박종류 전체</option>
              <option value="homestay">🏠 홈스테이</option>
              <option value="hotel">🏨 호텔</option>
              <option value="motel">🏩 모텔</option>
              <option value="guesthouse">🏘 게스트하우스</option>
              <option value="resort">🏖 리조트</option>
              <option value="villa">🏡 빌라</option>
              <option value="other">🏘 기타</option>
            </select>
          </div>

          <select id="qSort" class="select">
            <option value="recent">최신</option>
            <option value="rating">평점 높은 순</option>
            <option value="reviews">리뷰 많은 순</option>
          </select>
        </div>
      </div>
      <div id="itemsState" class="state">로딩중...</div>
      <div id="itemsGrid" class="grid"></div>
      
    </section>
  </main>

  <div id="siteFooter"></div>

  <script type="module" src="/assets/js/header-auth.js"></script>
  <script type="module" src="/assets/js/pages/homestay.rooms.js"></script>
  <script type="module" src="/assets/js/pages/homestay.js"></script>
</body>
</html>
